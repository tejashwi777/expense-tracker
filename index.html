
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡ Pinky Wallet ♡</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  padding:30px 15px;
  font-family:'Trebuchet MS',sans-serif;
  background:#fff0f5;
  color:#92516e;
}
.container {
  max-width:450px;
  margin:auto;
  background:#fffafd;
  padding:25px;
  border-radius:28px;
  box-shadow:0 10px 35px #edb6ce66;
}
h1 { text-align:center; color:#dc79a4; }
.subtitle { text-align:center; color:#bd89a2; }
.balance {
  background:linear-gradient(135deg,#f9b9d2,#e78bb4);
  color:white;
  padding:25px;
  border-radius:22px;
  text-align:center;
  margin:25px 0;
}
.balance h2 { font-size:34px; margin:10px; }
.stats { display:flex; gap:12px; }
.stat {
  flex:1;
  padding:15px;
  background:#fff0f6;
  border-radius:18px;
  text-align:center;
}
.stat p { font-size:12px; }
.stat h3 { margin:8px 0; }
h3 { color:#cf719b; }
input,select {
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #f3c5d8;
  border-radius:12px;
  background:#fff8fb;
  color:#92516e;
  outline:none;
}
button {
  cursor:pointer;
  border:0;
  background:#e98bb4;
  color:white;
  padding:13px;
  border-radius:13px;
  width:100%;
  margin-top:10px;
  font-weight:bold;
}
button:hover { background:#d86e9e; }
.transaction {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px;
  margin:10px 0;
  background:#fff1f6;
  border-radius:14px;
}
.transaction small { display:block; color:#b98aa2; }
.delete {
  width:auto;
  margin:0;
  padding:8px 12px;
  background:#f3a8c5;
}
.income { color:#56a987; }
.expense { color:#dc7196; }
#history { margin-top:15px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎀 Pinky Wallet 🎀</h1>
  <p class="subtitle">♡ save a little, dream a lot ♡</p>

  <div class="balance">
    <p>My total balance 💗</p>
    <h2 id="balance">Rs. 0</h2>
    <small>your money, your magic ✨</small>
  </div>

  <div class="stats">
    <div class="stat">
      <p>🌷 Income</p>
      <h3 id="income">Rs. 0</h3>
    </div>
    <div class="stat">
      <p>🧁 Expenses</p>
      <h3 id="expense">Rs. 0</h3>
    </div>
  </div>

  <h3>♡ Add a transaction</h3>
  <input id="title" placeholder="What did you spend on?">
  <input id="amount" type="number" min="0.01" step="0.01"
    placeholder="Amount (Rs.)">
  <select id="type">
    <option value="income">🌸 Income</option>
    <option value="expense">🎀 Expense</option>
  </select>
  <button onclick="addTransaction()">+ Add to my wallet 💕</button>

  <h3>🌷 My transactions</h3>
  <div id="history"></div>
</div>

<script>
let transactions = JSON.parse(
  localStorage.getItem("pinkyTransactions") || "[]"
);

function save() {
  localStorage.setItem("pinkyTransactions",
    JSON.stringify(transactions));
}

function render() {
  let income = 0, expense = 0;
  const history = document.getElementById("history");
  history.innerHTML = "";

  transactions.forEach((t, i) => {
    if(t.type === "income") income += t.amount;
    else expense += t.amount;

    let div = document.createElement("div");
    div.className = "transaction";

    let info = document.createElement("div");
    let name = document.createElement("strong");
    name.textContent = t.title;
    let date = document.createElement("small");
    date.textContent = t.date;
    info.append(name, date);

    let right = document.createElement("div");
    let value = document.createElement("strong");
    value.className = t.type;
    value.textContent =
      (t.type === "income" ? "+ " : "- ") + "Rs. " + t.amount;

    let del = document.createElement("button");
    del.className = "delete";
    del.textContent = "✕";
    del.setAttribute("aria-label", "Delete " + t.title);
    del.onclick = () => {
      transactions.splice(i, 1);
      save();
      render();
    };

    right.append(value, del);
    div.append(info, right);
    history.append(div);
  });

  document.getElementById("income").textContent =
    "Rs. " + income.toFixed(2);
  document.getElementById("expense").textContent =
    "Rs. " + expense.toFixed(2);
  document.getElementById("balance").textContent =
    "Rs. " + (income-expense).toFixed(2);
}

function addTransaction() {
  let title = document.getElementById("title").value.trim();
  let amount = Number(document.getElementById("amount").value);
  let type = document.getElementById("type").value;

  if(!title || !Number.isFinite(amount) || amount <= 0) {
    alert("Please enter a name and a valid amount 💗");
    return;
  }

  transactions.unshift({
    title, amount, type,
    date: new Date().toLocaleDateString()
  });

  save();
  render();
  document.getElementById("title").value = "";
  document.getElementById("amount").value = "";
}

render();
</script>
</body>
</html>
